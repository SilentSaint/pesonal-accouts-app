plugins {
    id 'java'
}

group = 'com.automaticexpense.tracker'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation 'com.amazonaws:aws-lambda-java-events:3.11.5'
    implementation platform('software.amazon.awssdk:bom:2.25.64')
    implementation 'software.amazon.awssdk:dynamodb'
    implementation 'software.amazon.awssdk:sns'
    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:apigatewaymanagementapi'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

tasks.register('lambdaZip', Zip) {
    dependsOn tasks.named('jar')
    archiveFileName = 'transaction-command-lambda.zip'
    destinationDirectory = layout.buildDirectory.dir('lambda')
    from(tasks.named('jar')) {
        into 'lib'
    }
    from(configurations.runtimeClasspath) {
        into 'lib'
    }
}

test {
    useJUnitPlatform()
}
