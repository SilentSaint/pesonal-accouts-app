name: CI/CD & Operational Quality Gates

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gate:
    name: Backend Java DDD & Hexagonal Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper & Run Tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend-quality-gate:
    name: Flutter Web, Mobile, and Browser E2E Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze Static Code Quality
        working-directory: frontend
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: frontend
        run: flutter test

      - name: Build Web Application Bundle
        working-directory: frontend
        run: flutter build web --release

      - name: Set up Node.js for browser E2E
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned Playwright client
        working-directory: frontend
        run: npm install --no-save --no-package-lock playwright@1.47.2

      - name: Run browser E2E against the release bundle with system Chrome
        working-directory: frontend
        run: node e2e_playwright_test.js

      - name: Upload browser E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.run_id }}
          path: |
            frontend/web_e2e_desktop.png
            frontend/web_e2e_mobile.png
          if-no-files-found: ignore

  lambda-package-gate:
    name: Lambda Source and Archive Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify reviewed Node.js Lambda source/archive parity
        run: |
          scripts/ci/build-lambda-artifacts
          node --test backend/lambda/test/*.test.js

      - name: Package and verify Java Lambda deployment artifact
        working-directory: backend
        run: |
          ./gradlew lambdaZip --no-daemon
          unzip -t build/lambda/transaction-command-lambda.zip

  infrastructure-gate:
    name: Terraform IaC Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      - name: Setup Java for Lambda archive build
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Lambda archives required by Terraform
        run: scripts/ci/build-lambda-artifacts

      - name: Terraform Init & Validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  disposable-dynamodb-integration-gate:
    name: Disposable DynamoDB API Integration Gate
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 8000:8000
    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://localhost:8000
      TABLE_NAME: production-readiness-${{ github.run_id }}
    steps:
      - name: Create disposable single-table DynamoDB resource
        run: |
          aws dynamodb create-table \
            --table-name "$TABLE_NAME" \
            --attribute-definitions AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S \
            --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url "$DYNAMODB_ENDPOINT"
          aws dynamodb wait table-exists \
            --table-name "$TABLE_NAME" \
            --endpoint-url "$DYNAMODB_ENDPOINT"

      - name: Exercise DynamoDB transactional API contract
        run: |
          aws dynamodb transact-write-items \
            --transact-items "[{\"Put\":{\"TableName\":\"$TABLE_NAME\",\"Item\":{\"PK\":{\"S\":\"USER#readiness\"},\"SK\":{\"S\":\"TRANSACTION#gate\"},\"amount\":{\"N\":\"1\"}}}}]" \
            --endpoint-url "$DYNAMODB_ENDPOINT"
          aws dynamodb get-item \
            --table-name "$TABLE_NAME" \
            --key '{"PK":{"S":"USER#readiness"},"SK":{"S":"TRANSACTION#gate"}}' \
            --query 'Item.amount.N' \
            --output text \
            --endpoint-url "$DYNAMODB_ENDPOINT" | grep -Fx '1'

      - name: Remove disposable DynamoDB resource
        if: always()
        run: |
          aws dynamodb delete-table \
            --table-name "$TABLE_NAME" \
            --endpoint-url "$DYNAMODB_ENDPOINT" || true
