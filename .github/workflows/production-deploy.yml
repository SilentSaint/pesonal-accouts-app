name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'I approve deploying the current main branch to production'
        required: true
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  readiness-gates:
    name: Required production readiness gates
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == 'yes'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy only after readiness gates
    needs: readiness-gates
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Enforce the manual production deployment boundary
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.confirm_production_deploy }}" = "yes"

      - name: Checkout the gated revision
        uses: actions/checkout@v4

      - name: Configure production AWS identity through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-production-deploy

      - name: Verify the expected production AWS account
        run: |
          test -n "$AWS_ACCOUNT_ID"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.x
          channel: stable

      - name: Set up Android SDK for the retained debug APK deliverable
        uses: android-actions/setup-android@v3

      - name: Prepare pinned Playwright client and system Chromium
        run: scripts/run-browser-e2e.sh --prepare

      - name: Run the shared guarded release with all candidate readiness gates
        env:
          PRODUCTION_DEPLOY_APPROVED: 'YES'
        run: scripts/manual_production_deploy.sh

      - name: Retain non-sensitive release identity and outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            dev_builds/releases/*/manifest.json
            dev_builds/releases/*/source.json
            dev_builds/releases/*/provenance.json
            dev_builds/releases/*/plan-review.json
            dev_builds/releases/*/verified-lambdas.json
            dev_builds/releases/*/status.json
            dev_builds/releases/*/events.jsonl
