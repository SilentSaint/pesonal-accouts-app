name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'I approve deploying the current main branch to production'
        required: true
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  readiness-gates:
    name: Required production readiness gates
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == 'yes'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy only after readiness gates
    needs: readiness-gates
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Enforce the manual production deployment boundary
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.confirm_production_deploy }}" = "yes"

      - name: Checkout the gated revision
        uses: actions/checkout@v4

      - name: Configure production AWS identity through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-production-deploy

      - name: Verify the expected production AWS account
        run: |
          test -n "$AWS_ACCOUNT_ID"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Build deployment Lambda archives from gated source
        run: |
          backend/lambda/build.sh --check
          ./backend/gradlew -p backend lambdaZip --no-daemon

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Apply reviewed infrastructure
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.x
          channel: stable

      - name: Build the gated web release and publish a version marker
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release
          printf '{"commit":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > build/web/deployment-version.json

      - name: Publish release, invalidate CloudFront, and verify the live version
        working-directory: terraform
        run: |
          bucket="$(terraform output -raw s3_web_bucket_name)"
          distribution_id="$(terraform output -raw cloudfront_distribution_id)"
          cloudfront_url="$(terraform output -raw cloudfront_web_url)"
          api_url="$(terraform output -raw api_gateway_url)"
          websocket_url="$(terraform output -raw websocket_sync_url)"
          (cd ../frontend && flutter build web --release --dart-define=API_BASE_URL="$api_url/api" --dart-define=WEBSOCKET_SYNC_URL="$websocket_url")
          aws s3 sync ../frontend/build/web "s3://$bucket" --delete --cache-control 'no-cache, no-store, must-revalidate'
          invalidation_id="$(aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths '/*' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$distribution_id" --id "$invalidation_id"
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 "$cloudfront_url/deployment-version.json?release=$GITHUB_SHA" | grep -F "\"commit\":\"$GITHUB_SHA\""
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 "$api_url/api/health"
