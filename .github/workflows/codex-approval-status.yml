name: Codex approval status
run-name: Codex approval status / ${{ github.event.pull_request.number || github.event.issue.number || github.event_name }}

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Keep permissions off unless a job explicitly needs them.
permissions: {}

jobs:
  resolve-target-head:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Check out trusted main policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve target PR head SHA
        id: resolve
        run: |
          if [ -f scripts/ci/codex-approval-status.js ]; then
            node scripts/ci/codex-approval-status.js --resolve-target-head
          else
            echo "Trusted main does not yet contain the approval policy; falling back to event payload head."
            printf 'head_sha=%s\n' "$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  select-pull-requests:
    needs: resolve-target-head
    # Selection must serialize with reconciliation under the same head SHA to ensure
    # duplicate-head and negative-feedback status writes do not race with ongoing
    # reconciliations. Deletions, dismissals, and negative feedback preempt via cancel-in-progress.
    concurrency:
      group: ${{ needs.resolve-target-head.outputs.head_sha != '' && format('codex-approval-{0}-{1}', github.repository, needs.resolve-target-head.outputs.head_sha) || format('codex-approval-select-{0}-{1}', github.repository, github.run_id) }}
      cancel-in-progress: ${{ (github.event.action == 'deleted' || github.event.action == 'dismissed' || startsWith(github.event.comment.user.login, 'chatgpt-codex-connector') || startsWith(github.event.review.user.login, 'chatgpt-codex-connector')) && needs.resolve-target-head.outputs.head_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      pr_targets: ${{ steps.select.outputs.pr_targets }}
    steps:
      - name: Check out trusted main policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 1

      - name: Select PRs for independent reconciliation
        id: select
        run: |
          if [ -f scripts/ci/codex-approval-status.js ]; then
            node scripts/ci/codex-approval-status.js --select-pr-targets
          else
            echo "Trusted main does not yet contain the approval policy; skipping pre-bootstrap selection."
            printf 'pr_targets=[]\n' >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODEX_PR_HEAD_SHA: ${{ needs.resolve-target-head.outputs.head_sha }}

  reconcile:
    needs: select-pull-requests
    if: ${{ needs.select-pull-requests.outputs.pr_targets != '' && needs.select-pull-requests.outputs.pr_targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select-pull-requests.outputs.pr_targets) }}
    concurrency:
      group: codex-approval-${{ github.repository }}-${{ matrix.target.head_sha }}
      # Share the durable per-head queue with selection; never replace a pending
      # deletion revocation or duplicate-head failure.
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out trusted main policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 1

      - name: Reconcile current Codex approval onto each PR head
        run: node scripts/ci/codex-approval-status.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          CODEX_REVIEW_BOT_LOGIN: chatgpt-codex-connector[bot]
          CODEX_PR_NUMBER: ${{ matrix.target.number }}
          CODEX_PR_HEAD_SHA: ${{ matrix.target.head_sha }}
