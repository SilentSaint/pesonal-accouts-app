name: Codex approval status

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Keep permissions off unless the reconciliation job explicitly needs them.
permissions: {}

concurrency:
  group: codex-approval-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out trusted main policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 1

      - name: Reconcile current Codex approval onto each PR head
        run: node scripts/ci/codex-approval-status.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          CODEX_REVIEW_BOT_LOGIN: chatgpt-codex-connector[bot]
